[project]
name = "token-budget"
version = "0.1.0"
description = "Deterministic token accounting, project budgeting, and hard usage gates for coding agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
[project.urls]
Repository = "https://github.com/brandonth92/token-budget-controller"
[project.scripts]
token-budget = "token_budget.cli:main"

[tool.setuptools]
# Explicit so setuptools does not treat landing/ or docs/ as packages (flat-layout discovery)
packages = ["token_budget"]
